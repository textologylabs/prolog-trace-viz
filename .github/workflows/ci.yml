name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install SWI-Prolog
        # The tracer and several integration tests shell out to `swipl`.
        run: sudo apt-get update && sudo apt-get install -y swi-prolog

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Type-check
        run: npm run lint

      - name: Test
        run: npm test
