name: Publish

# Publishes to npm when a version tag is pushed. The local `npm run release`
# flow bumps the version, commits, and creates the `v<x.y.z>` tag; pushing that
# tag (`git push origin main --tags`) triggers this workflow.
#
# Authentication is npm trusted publishing (OIDC): no NPM_TOKEN, nothing to
# store, expire or rotate. npm deprecates 2FA-bypass granular tokens for direct
# publishing around January 2027. https://docs.npmjs.com/trusted-publishers
#
# One-time setup, on https://www.npmjs.com/package/prolog-trace-viz/access
#   Trusted Publisher -> GitHub Actions
#     Organization or user: textologylabs
#     Repository:           prolog-trace-viz  (bare name, not owner/name)
#     Workflow filename:    publish.yml       (must match this file EXACTLY — a
#                                              .yaml/.yml slip surfaces as a 404
#                                              "package not found" on exchange)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # OIDC token for trusted publishing (and provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No registry-url: it makes setup-node write an .npmrc wired to
      # NODE_AUTH_TOKEN, and a placeholder value there stops npm falling back
      # to OIDC. npm defaults to registry.npmjs.org anyway.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm >= 11.5.1 speaks OIDC. Pinned to 11 because npm@latest is now v12,
      # which requires Node >= 22.
      - name: Use an npm that speaks OIDC
        run: npm install -g npm@11

      - name: Install SWI-Prolog
        run: sudo apt-get update && sudo apt-get install -y swi-prolog

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish to npm
        run: npm publish --access public
